name: Ajustar fronteira transaccional e testes v2

on:
  push:
    branches:
      - fix/atchutchi-mysql-transaction-boundary-v2

permissions:
  contents: write

jobs:
  adjust-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, mbstring
          tools: composer:v2

      - name: Aplicar a correcção mínima
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          identity = Path('wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php')
          content = identity.read_text(encoding='utf-8')
          start = content.index('\tprivate function executeBoundaryCommand( string $sql ): int|false {')
          end = content.index('\n\t/**\n\t * Confirma o resultado sem propagar detalhes da ligação.', start)
          replacement = '''\tprivate function executeBoundaryCommand( string $sql ): int|false {
          \t\t$this->pre_execution_rejection = false;
          \t\t++$this->query_depth;
          \t\ttry {
          \t\t\t$result = $this->executeParentQuery( $sql );
          \t\t} catch ( Throwable ) {
          \t\t\t--$this->query_depth;
          \t\t\tif ( $this->pre_execution_rejection ) {
          \t\t\t\t$this->pre_execution_rejection = false;
          \t\t\t\ttry {
          \t\t\t\t\t$this->boundary()->cancelPrepared();
          \t\t\t\t} catch ( Throwable ) {
          \t\t\t\t\t$this->boundary()->markUnavailable();
          \t\t\t\t}
          \t\t\t\t$this->last_error = 'Alteração da consulta dedicada recusada.';
          \t\t\t\treturn false;
          \t\t\t}
          \t\t\t$this->confirmQuery( false );
          \t\t\t$this->last_error = 'Fronteira transaccional não confirmada.';
          \t\t\treturn false;
          \t\t}
          \t\t--$this->query_depth;

          \t\t$success = false !== $result && '' === $this->last_error;
          \t\t$this->confirmQuery( $success );
          \t\t$this->last_error = $success ? '' : 'Fronteira transaccional não confirmada.';
          \t\treturn $success ? 0 : false;
          \t}
          '''
          content = content[:start] + replacement + content[end:]
          old = "$this->boundary()->confirm( $success, $this->connectionLost() );"
          new = "$this->boundary()->confirm( $success, $success ? false : $this->connectionLost() );"
          if content.count(old) != 1:
              raise SystemExit('confirmQuery esperado não localizado')
          content = content.replace(old, new, 1)
          content = content.replace(
              ' * Executa uma fronteira canónica sem filtros SQL.',
              ' * Executa uma fronteira canónica com a mesma guarda de imutabilidade SQL.'
          )
          identity.write_text(content, encoding='utf-8')

          double = Path('tests/phpunit/doubles/IdentityWpdbDouble.php')
          content = double.read_text(encoding='utf-8')
          old_constructor = "\tpublic function __construct( string $user = '', string $password = '', string $database = '', string $host = '' ) {}"
          new_constructor = '''\tpublic function __construct( string $user = '', string $password = '', string $database = '', string $host = '' ) {
          \t\t$this->ready = true;
          \t\tif ( function_exists( 'mysqli_init' ) ) {
          \t\t\t$reporting = ( new mysqli_driver() )->report_mode;
          \t\t\tmysqli_report( MYSQLI_REPORT_OFF );
          \t\t\ttry {
          \t\t\t\t$this->dbh = mysqli_init();
          \t\t\t} finally {
          \t\t\t\tmysqli_report( $reporting );
          \t\t\t}
          \t\t}
          \t\t$boundary = new \\Arn\\Intranet\\Identity\\TransactionBoundary();
          \t\t$boundary->markReady();
          \t\t$property = new ReflectionProperty( \\Arn\\Intranet\\Identity\\IdentityWpdb::class, 'transaction_boundary' );
          \t\t$property->setValue( $this, $boundary );
          \t}

          \t/** Fecha a ligação simulada e permite testar a invalidação da fronteira. */
          \tpublic function close(): bool {
          \t\t$this->ready = false;
          \t\t$this->dbh   = null;
          \t\treturn true;
          \t}'''
          if content.count(old_constructor) != 1:
              raise SystemExit('construtor do double não localizado')
          double.write_text(content.replace(old_constructor, new_constructor, 1), encoding='utf-8')

          transaction_test = Path('tests/phpunit/IdentityWpdbTransactionTest.php')
          content = transaction_test.read_text(encoding='utf-8')
          old_test = '''\t/** Estado sem ligação nunca é apresentado como seguro. */
          \tpublic function testStateRefusesWithoutDedicatedConnection(): void {
          \t\t$database = new IdentityWpdb( '', '', '', '' );
          \t\t$this->expectException( RuntimeException::class );
          \t\t$this->expectExceptionMessage( 'Estado transaccional indisponível.' );
          \t\t$database->inTransaction();
          \t}'''
          new_test = '''\t/** Estado depois do fecho nunca é apresentado como seguro. */
          \tpublic function testStateRefusesAfterDedicatedConnectionCloses(): void {
          \t\t$database = new IdentityWpdb( '', '', '', '' );
          \t\tself::assertFalse( $database->inTransaction() );
          \t\tself::assertTrue( $database->close() );
          \t\t$this->expectException( RuntimeException::class );
          \t\t$this->expectExceptionMessage( 'Estado transaccional indisponível.' );
          \t\t$database->inTransaction();
          \t}'''
          if content.count(old_test) != 1:
              raise SystemExit('teste de fecho não localizado')
          transaction_test.write_text(content.replace(old_test, new_test, 1), encoding='utf-8')

          repository_test = Path('tests/phpunit/WpdbIdentityLinkRepositoryTest.php')
          content = repository_test.read_text(encoding='utf-8')
          replacements = {
              "self::assertSame( 'COMMIT',": "self::assertSame( 'COMMIT AND NO CHAIN NO RELEASE',",
              "self::assertSame( 'ROLLBACK',": "self::assertSame( 'ROLLBACK AND NO CHAIN NO RELEASE',",
              "self::assertNotContains( 'COMMIT',": "self::assertNotContains( 'COMMIT AND NO CHAIN NO RELEASE',",
              "self::assertNotContains( 'ROLLBACK',": "self::assertNotContains( 'ROLLBACK AND NO CHAIN NO RELEASE',",
          }
          for old, new in replacements.items():
              content = content.replace(old, new)
          repository_test.write_text(content, encoding='utf-8')
          PY

          php -l wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php
          php -l tests/phpunit/doubles/IdentityWpdbDouble.php
          php -l tests/phpunit/IdentityWpdbTransactionTest.php
          php -l tests/phpunit/WpdbIdentityLinkRepositoryTest.php
          git diff --check

      - name: Instalar dependências PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verificar testes focados RED para GREEN
        run: vendor/bin/phpunit -c phpunit.xml.dist --filter '/(IdentityWpdbTransactionTest|WpdbIdentityLinkRepositoryTest)/'

      - name: Verificar toda a suite PHP
        run: vendor/bin/phpunit -c phpunit.xml.dist

      - name: Verificar normas dos ficheiros alterados
        run: vendor/bin/phpcs wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php tests/phpunit/doubles/IdentityWpdbDouble.php tests/phpunit/IdentityWpdbTransactionTest.php tests/phpunit/WpdbIdentityLinkRepositoryTest.php

      - name: Publicar o ajuste verificado
        shell: bash
        run: |
          set -euo pipefail
          git add wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php tests/phpunit/doubles/IdentityWpdbDouble.php tests/phpunit/IdentityWpdbTransactionTest.php tests/phpunit/WpdbIdentityLinkRepositoryTest.php
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: alinhar fronteira transaccional com wpdb e testes puros'
          git push origin HEAD:fix/atchutchi-mysql-transaction-boundary-v2
