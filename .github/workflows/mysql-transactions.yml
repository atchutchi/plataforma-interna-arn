name: Transacções MySQL

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mysql-transactions:
    name: MySQL ${{ matrix.mysql }}, fronteiras transaccionais
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.44', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root-test
          MYSQL_DATABASE: arn_tx_test
          MYSQL_USER: arn_tx
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, mbstring
      - name: class-wpdb do WordPress 7.1.3
        run: curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/7.1.3/wp-includes/class-wpdb.php -o /tmp/class-wpdb.php
      - name: Diagnóstico seguro da normalização mysqli
        env:
          ARN_TX_TEST_USER: arn_tx
          ARN_TX_TEST_PASSWORD: test
          ARN_TX_TEST_NAME: arn_tx_test
        run: |
          php <<'PHP'
          <?php
          mysqli_report(MYSQLI_REPORT_OFF);
          $db = mysqli_init();
          if (!$db->real_connect('127.0.0.1', getenv('ARN_TX_TEST_USER'), getenv('ARN_TX_TEST_PASSWORD'), getenv('ARN_TX_TEST_NAME'), 3306)) {
              throw new RuntimeException('diagnóstico: ligação');
          }
          echo "diagnóstico: ligação OK\n";
          if (!$db->autocommit(true)) {
              throw new RuntimeException('diagnóstico: autocommit');
          }
          echo "diagnóstico: autocommit OK\n";
          $modes = $db->query('SELECT @@SESSION.sql_mode');
          if (!$modes instanceof mysqli_result) {
              throw new RuntimeException('diagnóstico: leitura sql_mode');
          }
          $row = $modes->fetch_row();
          $modes->free();
          if (!is_array($row) || !array_key_exists(0, $row) || !is_scalar($row[0])) {
              throw new RuntimeException('diagnóstico: valor sql_mode');
          }
          $normalised = [];
          foreach (array_filter(explode(',', strtoupper((string) $row[0])), 'strlen') as $mode) {
              $mode = trim($mode);
              if (1 !== preg_match('/^[A-Z0-9_]+$/D', $mode)) {
                  throw new RuntimeException('diagnóstico: sintaxe sql_mode');
              }
              if ('NO_BACKSLASH_ESCAPES' !== $mode) {
                  $normalised[] = $mode;
              }
          }
          $sqlMode = sprintf("SET SESSION sql_mode = '%s'", implode(',', array_values(array_unique($normalised))));
          if (true !== $db->query($sqlMode)) {
              throw new RuntimeException('diagnóstico: escrita sql_mode errno=' . $db->errno);
          }
          echo "diagnóstico: sql_mode OK\n";
          if (true !== $db->query('SET SESSION completion_type = 0')) {
              throw new RuntimeException('diagnóstico: completion_type errno=' . $db->errno);
          }
          echo "diagnóstico: completion_type OK\n";
          PHP
      - name: Falha inicial sem credenciais, sem saída
        run: php tests/integration/identity-connection-failure.php /tmp/class-wpdb.php
      - name: Instrumentar origem segura da falha de ligação
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php')
          content = path.read_text(encoding='utf-8')
          method = content.index('\tpublic function db_connect(')
          catch_start = content.index('\t\t} catch ( Throwable ) {', method)
          finally_start = content.index('\t\t} finally {', catch_start)
          block = content[catch_start:finally_start]
          block = block.replace('catch ( Throwable )', 'catch ( Throwable $connection_error )', 1)
          needle = "\t\t\tthrow new RuntimeException( 'Ligação dedicada indisponível.' );\n"
          throw_pos = block.rfind(needle)
          if throw_pos < 0:
              raise SystemExit('throw de ligação não localizado')
          diagnostic = (
              "\t\t\tif ( '1' === getenv( 'ARN_TX_DIAGNOSTIC' ) ) {\n"
              "\t\t\t\t$diagnostic_message = $connection_error->getMessage();\n"
              "\t\t\t\tforeach ( array( 'ARN_TX_TEST_USER', 'ARN_TX_TEST_PASSWORD', 'ARN_TX_TEST_NAME', 'ARN_TX_TEST_HOST' ) as $diagnostic_key ) {\n"
              "\t\t\t\t\t$diagnostic_value = getenv( $diagnostic_key );\n"
              "\t\t\t\t\tif ( is_string( $diagnostic_value ) && '' !== $diagnostic_value ) {\n"
              "\t\t\t\t\t\t$diagnostic_message = str_replace( $diagnostic_value, '[redigido]', $diagnostic_message );\n"
              "\t\t\t\t\t}\n"
              "\t\t\t\t}\n"
              "\t\t\t\tthrow new RuntimeException( 'Diagnóstico ligação: ' . get_class( $connection_error ) . '@' . basename( $connection_error->getFile() ) . ':' . $connection_error->getLine() . ' ' . substr( $diagnostic_message, 0, 240 ) );\n"
              "\t\t\t}\n"
          )
          block = block[:throw_pos] + diagnostic + block[throw_pos:]
          content = content[:catch_start] + block + content[finally_start:]
          path.write_text(content, encoding='utf-8')
          PY
          php -l wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php
      - name: Fronteiras transaccionais
        env:
          ARN_TX_TEST_USER: arn_tx
          ARN_TX_TEST_PASSWORD: test
          ARN_TX_TEST_NAME: arn_tx_test
          ARN_TX_TEST_HOST: 127.0.0.1:3306
          ARN_TX_ROOT_USER: root
          ARN_TX_ROOT_PASSWORD: root-test
          ARN_TX_WPDB: /tmp/class-wpdb.php
          ARN_TX_DIAGNOSTIC: '1'
        run: php tests/integration/mysql-transaction-state.php /tmp/class-wpdb.php
