name: Transacções MySQL V2

on:
  push:
    branches:
      - fix/atchutchi-mysql-transaction-guard-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mysql-transaction-guard:
    name: MySQL 8.0, guarda transaccional
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: arn_tx_test
          MYSQL_USER: arn_tx
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, mbstring
      - name: Obter class-wpdb do WordPress 7.1.3
        run: curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/7.1.3/wp-includes/class-wpdb.php -o /tmp/class-wpdb.php
      - name: Executar regressão da guarda transaccional
        env:
          ARN_TX_TEST_USER: arn_tx
          ARN_TX_TEST_PASSWORD: test
          ARN_TX_TEST_NAME: arn_tx_test
          ARN_TX_TEST_HOST: 127.0.0.1:3306
          ARN_TX_WPDB: /tmp/class-wpdb.php
        run: php tests/integration/mysql-transaction-guard-v2.php /tmp/class-wpdb.php
      - name: Executar persistência People exclusiva
        env:
          ARN_TX_TEST_USER: arn_tx
          ARN_TX_TEST_PASSWORD: test
          ARN_TX_TEST_NAME: arn_tx_test
          ARN_TX_TEST_HOST: 127.0.0.1:3306
          ARN_TX_WPDB: /tmp/class-wpdb.php
        run: php tests/integration/mysql-people-transaction.php /tmp/class-wpdb.php
