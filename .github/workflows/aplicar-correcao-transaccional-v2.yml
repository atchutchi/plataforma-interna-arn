name: Aplicar correcao transaccional v2

on:
  push:
    branches:
      - fix/atchutchi-mysql-transaction-boundary-v2

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, mbstring

      - name: Reconstruir e aplicar o patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/mysql-v2/chunk-*.txt | tr -d '\n' | base64 --decode | gzip --decompress > /tmp/arn-mysql-v2.patch
          echo 'f6166298616e00b323f90be6a771633ebde6c5221ddfda237a36c8eaa2fdac09  /tmp/arn-mysql-v2.patch' | sha256sum --check --strict
          awk '
            BEGIN { in_identity=0; seen_first_hunk=0; skipping_first_hunk=0 }
            /^diff --git / {
              if (in_identity) { in_identity=0; skipping_first_hunk=0 }
              if ($0 == "diff --git a/wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php b/wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php") {
                in_identity=1; seen_first_hunk=0; skipping_first_hunk=0
              }
              print; next
            }
            in_identity && /^@@ / {
              if (!seen_first_hunk) { seen_first_hunk=1; skipping_first_hunk=1; next }
              skipping_first_hunk=0; print; next
            }
            in_identity && skipping_first_hunk { next }
            { print }
          ' /tmp/arn-mysql-v2.patch > /tmp/arn-mysql-v2-effective.patch
          echo '7a4799adffa574edca16712315f6094ff8d61d6a207c0fac15db43c5f7b82f03  /tmp/arn-mysql-v2-effective.patch' | sha256sum --check --strict
          python - <<'PY'
          from pathlib import Path
          path = Path('wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php')
          content = path.read_text(encoding='utf-8')
          redundant = '\t\t\t\t// Não propagar detalhes internos de uma ligação parcialmente aberta.\n'
          if content.count(redundant) != 1:
              raise SystemExit('Estado inesperado do IdentityWpdb antes da aplicação')
          path.write_text(content.replace(redundant, '', 1), encoding='utf-8')
          PY
          patch --batch --forward --fuzz=0 -p1 --dry-run < /tmp/arn-mysql-v2-effective.patch
          patch --batch --forward --fuzz=0 -p1 < /tmp/arn-mysql-v2-effective.patch
          git add -A
          git diff --cached --check
          count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "Ficheiros preparados: ${count}"
          git diff --cached --name-status
          test "${count}" = "22"

      - name: Verificar sintaxe dos ficheiros centrais
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/arn-intranet-core/src/Identity/TransactionBoundary.php
          php -l wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php
          php -l tests/phpunit/TransactionBoundaryTest.php
          php -l tests/phpunit/IdentityWpdbTransactionTest.php
          php -l tests/integration/mysql-transaction-bootstrap.php
          php -l tests/integration/mysql-transaction-state.php
          php -l tests/integration/mysql-transaction-worker.php

      - name: Publicar a correcao na branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap/mysql-v2 .github/workflows/aplicar-correcao-transaccional-v2.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: controlar fronteiras transaccionais da ligacao dedicada'
          git push origin HEAD:fix/atchutchi-mysql-transaction-boundary-v2
