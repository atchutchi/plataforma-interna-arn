name: Aplicar correcao da guarda de placeholders

on:
  push:
    branches:
      - fix/atchutchi-mysql-transaction-boundary-v2

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install

      - name: Confirmar regressao RED no wpdb real
        run: |
          set +e
          npm run test:identity-placeholder:integration > /tmp/placeholder-red.log 2>&1
          status=$?
          set -e
          cat /tmp/placeholder-red.log
          if [ "$status" -eq 0 ]; then
            echo "A regressao passou antes da correcao."
            exit 1
          fi
          grep -Eq 'Falhou placeholder dedicado|Alteração da consulta dedicada recusada' /tmp/placeholder-red.log

      - name: Normalizar apenas o escape interno do wpdb
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php')
          text = path.read_text(encoding='utf-8')
          old = """\t\t$guard = function ( $filtered ) use ( $sql ) {\n\t\t\tif ( ! is_string( $filtered ) || $filtered !== $sql ) {\n\t\t\t\t$this->pre_execution_rejection = true;"""
          new = """\t\t$expected = $this->remove_placeholder_escape( $sql );\n\t\t$guard    = function ( $filtered ) use ( $expected ) {\n\t\t\tif ( ! is_string( $filtered ) || $this->remove_placeholder_escape( $filtered ) !== $expected ) {\n\t\t\t\t$this->pre_execution_rejection = true;"""
          if text.count(old) != 1:
              raise SystemExit('Guarda SQL esperada nao encontrada')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          for temporary in (
              Path('.github/workflows/aplicar-placeholder-guard-v2.yml'),
              Path('docs/.trigger-placeholder-guard-v2'),
          ):
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Confirmar GREEN e guardas negativas
        run: |
          npm run test:identity-placeholder:integration
          node scripts/wp-env.mjs --tests run cli wp config set WP_ENVIRONMENT_TYPE local --type=constant
          npm run test:communications:integration
          npm run test:calendar:integration
          node scripts/wp-env.mjs --tests run cli --env-cwd=arn-repo vendor/bin/phpunit -c phpunit.xml.dist tests/phpunit/IdentityWpdbTransactionTest.php tests/phpunit/TransactionBoundaryTest.php
          node scripts/wp-env.mjs --tests run cli --env-cwd=arn-repo vendor/bin/phpcs wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php tests/integration/identity-placeholder-guard.php

      - if: always()
        run: npm run env:stop:tests

      - name: Publicar correcao na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: aceitar escape interno de placeholders do wpdb"
          git push origin HEAD:fix/atchutchi-mysql-transaction-boundary-v2
