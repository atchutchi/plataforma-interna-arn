name: Preparar dependências OIDC no contentor
on:
  push:
    branches: [feature/atchutchi-F1-02-google-local]
    paths:
      - scripts/resolve-oidc-dependencies.php
      - .github/workflows/oidc-dependencies.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: node scripts/wp-env.mjs --tests run cli --env-cwd=arn-repo env ARN_RESOLVE_OIDC_DEPENDENCIES=1 php scripts/resolve-oidc-dependencies.php
      - run: npm run composer:install
      - run: node scripts/wp-env.mjs --tests run cli --env-cwd=arn-repo composer audit --locked --format=json
      - uses: actions/upload-artifact@v4
        with:
          name: oidc-composer-lock
          path: |
            composer.json
            composer.lock
          retention-days: 7
      - if: always()
        run: npm run env:stop:tests
