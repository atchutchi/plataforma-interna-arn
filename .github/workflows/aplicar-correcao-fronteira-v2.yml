name: Aplicar correcao da fronteira v2

on:
  push:
    branches:
      - fix/atchutchi-mysql-transaction-boundary-v2

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring

      - name: Confirmar regressao RED
        run: |
          php -r 'require "wp-content/plugins/arn-intranet-core/src/Identity/TransactionBoundary.php"; $cases = array("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ", "START TRANSACTION WITH CONSISTENT SNAPSHOT", "SET SESSION innodb_lock_wait_timeout=1", "CREATE TRIGGER arn_probe BEFORE INSERT ON arn_table FOR EACH ROW BEGIN IF NEW.id=1 THEN SIGNAL SQLSTATE \'45000\' SET MESSAGE_TEXT=\'probe\'; END IF; END"); foreach ($cases as $sql) { $boundary = new Arn\Intranet\Identity\TransactionBoundary(); $boundary->markReady(); try { $boundary->prepare($sql); fwrite(STDERR, "O caso RED foi aceite: {$sql}\n"); exit(1); } catch (RuntimeException) {} } echo "RED confirmado.\n";'

      - name: Aplicar correcao
        run: python3 .github/scripts/apply_transaction_boundary_v2.py

      - name: Confirmar sintaxe e comportamento GREEN
        run: |
          php -l wp-content/plugins/arn-intranet-core/src/Identity/TransactionBoundary.php
          php -l wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php
          php -l tests/phpunit/TransactionBoundaryTest.php
          php -l tests/integration/mysql-transaction-state.php
          php -l tests/integration/news-editorial.php
          php -r 'require "wp-content/plugins/arn-intranet-core/src/Identity/TransactionBoundary.php"; $boundary = new Arn\Intranet\Identity\TransactionBoundary(); $boundary->markReady(); if ("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ" !== $boundary->prepare("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ")) exit(1); $boundary->confirm(true); if ("SET SESSION innodb_lock_wait_timeout = 1" !== $boundary->prepare("SET SESSION innodb_lock_wait_timeout=1")) exit(1); $boundary->confirm(true); if ("START TRANSACTION WITH CONSISTENT SNAPSHOT" !== $boundary->prepare("START TRANSACTION WITH CONSISTENT SNAPSHOT")) exit(1); $boundary->confirm(true); if (!$boundary->inTransaction()) exit(1); if ("ROLLBACK AND NO CHAIN NO RELEASE" !== $boundary->prepare("ROLLBACK")) exit(1); $boundary->confirm(true); $trigger = "CREATE TRIGGER arn_compound BEFORE INSERT ON arn_table FOR EACH ROW BEGIN IF NEW.id=1 THEN SIGNAL SQLSTATE \'45000\' SET MESSAGE_TEXT=\'compound\'; END IF; END"; if ($trigger !== $boundary->prepare($trigger)) exit(1); $boundary->confirm(true); echo "GREEN confirmado.\n";'

      - name: Executar testes focados
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit -c phpunit.xml.dist tests/phpunit/TransactionBoundaryTest.php
          vendor/bin/phpcs wp-content/plugins/arn-intranet-core/src/Identity/TransactionBoundary.php wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php tests/phpunit/TransactionBoundaryTest.php tests/integration/mysql-transaction-state.php tests/integration/news-editorial.php

      - name: Publicar correcao na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preservar contratos SQL na fronteira transaccional"
          git push origin HEAD:fix/atchutchi-mysql-transaction-boundary-v2
