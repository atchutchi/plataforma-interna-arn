name: Verificação

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node, lint e construção
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  php:
    name: PHP 8.4, PHPUnit e phpcs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist
      - run: vendor/bin/phpcs

  identity-integration:
    name: WordPress e persistência MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - run: npm run test:identity:integration
      - run: npm run test:oidc:integration
      - run: npm run test:authorization:integration
      - run: npm run test:identity-connection:integration
      - run: npm run test:account-sessions:integration
      - run: npm run test:notifications:integration
      - run: npm run test:units:integration
      - run: npm run test:people:integration
      - run: npm run test:people-installer:integration
      - run: npm run test:import-preview:integration
      - run: npm run test:editorial:integration
      - run: npm run test:private-files:integration
      - run: npm run test:local-private-files:integration
      - if: always()
        run: npm run env:stop:tests

  document-catalog-integration:
    name: Catálogo documental, WordPress e MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - run: npm run test:document-catalog:integration
      - if: always()
        run: npm run env:stop:tests

  news-integration:
    name: Notícias locais, WordPress e MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - run: npm run test:news:integration
      - run: npm run test:news-editorial:integration
      - run: npm run test:news-editorial-installer:integration
      - run: npm run test:news-editorial-upgrade:integration
      - if: always()
        run: npm run env:stop:tests

  f112-integration:
    name: Comunicados e calendário, SQL sintético
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - name: Gates negativos em development
        run: |
          npm run test:communications:integration
          npm run test:calendar:integration
          npm run test:f112-installer:integration
          npm run test:f112-readiness:integration
      - name: Activar local apenas no contentor efémero desta job
        run: node scripts/wp-env.mjs --tests run cli wp config set WP_ENVIRONMENT_TYPE local --type=constant
      - name: Comunicações com SQL, sessão nativa e dois escritores
        run: npm run test:communications:integration
      - name: Calendário com SQL, sessão nativa e dois escritores
        run: npm run test:calendar:integration
      - name: Instalador explícito, colisões e repetição sem alterações
        run: npm run test:f112-installer:integration
      - name: Instalação incompleta mantém rotas fechadas
        run: npm run test:f112-readiness:integration
      - if: always()
        run: npm run env:stop:tests

  workspace-integration:
    name: Pré-cadastro Workspace, SQL fictício e concorrência
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - name: Gates negativos em development, sem criar contas
        run: |
          npm run test:workspace-provisioning:integration
          npm run test:workspace-access:integration
          npm run test:workspace-claim:integration
          npm run test:workspace-readiness:integration
      - name: Activar local apenas no contentor efémero desta job
        run: node scripts/wp-env.mjs --tests run cli wp config set WP_ENVIRONMENT_TYPE local --type=constant
      - run: npm run test:workspace-provisioning:integration
      - run: npm run test:workspace-access:integration
      - run: npm run test:workspace-claim:integration
      - run: npm run test:workspace-readiness:integration
      - if: always()
        run: npm run env:stop:tests
