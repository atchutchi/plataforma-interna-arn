name: Verificação

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node, lint e construção
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  php:
    name: PHP 8.4, PHPUnit e phpcs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml.dist
      - run: vendor/bin/phpcs

  identity-integration:
    name: WordPress e persistência MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run env:start:tests
      - run: npm run env:check:tests
      - run: npm run composer:install
      - run: npm run test:identity:integration
      - run: npm run test:oidc:integration
      - run: npm run test:authorization:integration
      - run: npm run test:identity-connection:integration
      - run: npm run test:account-sessions:integration
      - run: npm run test:notifications:integration
      - run: npm run test:units:integration
      - run: npm run test:import-preview:integration
      - run: npm run test:editorial:integration
      - if: always()
        run: npm run env:stop:tests
