name: Transaction state v2

on:
  push:
    branches: ['fix/atchutchi-mysql-transaction-state-v2']
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/plugins/arn-intranet-core/src/Identity/IdentityWpdb.php'
      - 'wp-content/plugins/arn-intranet-core/src/**'
      - 'tests/integration/transaction-state-v2*.php'
      - 'tests/integration/mysql-people-transaction.php'
      - 'tests/integration/mysql-transaction-bootstrap.php'
      - '.github/workflows/transaction-state-v2.yml'

permissions:
  contents: read

jobs:
  transaction-state:
    name: ${{ matrix.label }} transaction state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: MySQL 8.0.44
            image: mysql:8.0.44
            engine: mysql
          - label: MariaDB 11.8
            image: mariadb:11.8
            engine: mariadb
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: arn_tx_test
          MYSQL_USER: arn_tx
          MYSQL_PASSWORD: test
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: arn_tx_test
          MARIADB_USER: arn_tx
          MARIADB_PASSWORD: test
        ports:
          - 127.0.0.1:3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mysqli, mbstring
      - name: Instalar cliente SQL e aguardar o motor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-mysql-client
          for attempt in $(seq 1 60); do
            if mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -ptest --silent; then
              exit 0
            fi
            sleep 2
          done
          echo 'Motor SQL não ficou disponível.' >&2
          exit 1
      - name: Ativar Performance Schema na MariaDB
        if: matrix.engine == 'mariadb'
        env:
          DATABASE_CONTAINER: ${{ job.services.database.id }}
        run: |
          docker exec "$DATABASE_CONTAINER" sh -c "printf '[mariadb]\nperformance_schema=ON\n' > /etc/mysql/conf.d/arn-transaction-state.cnf"
          docker restart "$DATABASE_CONTAINER"
          for attempt in $(seq 1 60); do
            if mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -ptest --silent; then
              exit 0
            fi
            sleep 2
          done
          echo 'MariaDB não regressou depois de ativar Performance Schema.' >&2
          exit 1
      - name: Preparar observação transaccional com privilégios mínimos
        run: |
          test "$(mysql --protocol=tcp -h 127.0.0.1 -uroot -ptest -Nse 'SELECT @@performance_schema')" = '1'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -ptest <<'SQL'
          UPDATE performance_schema.setup_instruments
             SET ENABLED = 'YES', TIMED = 'YES'
           WHERE NAME = 'transaction';
          UPDATE performance_schema.setup_consumers
             SET ENABLED = 'YES'
           WHERE NAME = 'events_transactions_current';
          GRANT SELECT ON performance_schema.threads TO 'arn_tx'@'%';
          GRANT SELECT ON performance_schema.setup_instruments TO 'arn_tx'@'%';
          GRANT SELECT ON performance_schema.setup_consumers TO 'arn_tx'@'%';
          GRANT SELECT ON performance_schema.events_transactions_current TO 'arn_tx'@'%';
          FLUSH PRIVILEGES;
          SQL
          test "$(mysql --protocol=tcp -h 127.0.0.1 -uroot -ptest -Nse "SELECT COUNT(*) FROM performance_schema.setup_instruments WHERE NAME = 'transaction' AND ENABLED = 'YES'")" = '1'
          test "$(mysql --protocol=tcp -h 127.0.0.1 -uroot -ptest -Nse "SELECT COUNT(*) FROM performance_schema.setup_consumers WHERE NAME = 'events_transactions_current' AND ENABLED = 'YES'")" = '1'
      - name: Obter class-wpdb da versão fixada
        run: curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/7.1.3/wp-includes/class-wpdb.php -o /tmp/class-wpdb.php
      - name: Executar prova transaccional v2
        env:
          ARN_TX_V2_USER: arn_tx
          ARN_TX_V2_PASSWORD: test
          ARN_TX_V2_NAME: arn_tx_test
          ARN_TX_V2_HOST: 127.0.0.1:3306
          ARN_TX_V2_WPDB: /tmp/class-wpdb.php
        run: php tests/integration/transaction-state-v2.php /tmp/class-wpdb.php
      - name: Executar regressão People e consumidores
        env:
          ARN_TX_TEST_USER: arn_tx
          ARN_TX_TEST_PASSWORD: test
          ARN_TX_TEST_NAME: arn_tx_test
          ARN_TX_TEST_HOST: 127.0.0.1:3306
          ARN_TX_WPDB: /tmp/class-wpdb.php
        run: php tests/integration/mysql-people-transaction.php /tmp/class-wpdb.php
